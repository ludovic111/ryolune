[package]
name = "ryolune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "ryolune"

[dependencies]
serde.workspace = true
ryolune-engine = { path = "../engine" }
serde_json.workspace = true
log = "0.4"
# The window: Zed's GPU interface framework (gpui.rs). Shaders are compiled when the window
# opens, so the build needs no Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
futures = "0.3"
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
raw-window-handle = "0.6"
unicode-segmentation = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
ryolune-plugin = { path = "../sdk" }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "ryolune"
path = "src/main.rs"

[dev-dependencies]
ryolune-tools = { path = "../tools" }
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSGraphics", "NSApplication", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = "0.3"
