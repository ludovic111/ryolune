[package]
name = "ryolune-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ryolune-plugin = { path = "../sdk" }
serde.workspace = true
serde_json.workspace = true
cpal = "0.16"
rtrb = "0.3"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
tempfile = "3"
base64 = "0.22"
fs2 = "0.4.3"
clap-sys = "0.5"
vst3 = "0.3"
libloading = "0.8"
# Messages LV2 plugins log (log:log) go to `tracing`, which kimchi writes to its log file.
tracing = "0.1"
# 0.10 (coremidi 0.8, core-foundation 0.9): gpui pins core-foundation =0.10.0, which
# coremidi 0.9 (midir 0.11) cannot share.
midir = "0.10.3"
midly = { version = "0.5.3", default-features = false, features = ["std", "strict"] }
# Ogg Vorbis export: BSD-3-Clause, vendored libogg/libvorbis (aoTuV) built with `cc`.
vorbis_rs = { version = "0.5", default-features = false }

[dev-dependencies]
ryolune-plugin-gain = { path = "../plugins/gain" }
ondera-abi1-fixture = { path = "../plugins/abi1-fixture" }
ryolune-lv2-fixture = { path = "../plugins/lv2-fixture" }
ryolune-ladspa-fixture = { path = "../plugins/ladspa-fixture" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-audio-toolbox = { version = "0.3", features = ["AudioComponent", "AUComponent", "AudioUnitProperties", "MusicDevice", "AudioUnitParameters", "objc2-core-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFPropertyList", "CFData", "CFDictionary", "CFString", "CFURL", "CFBundle", "CFBase", "CFCGTypes"] }
objc2-foundation = "0.3"

