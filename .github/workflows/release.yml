name: Release
# Builds Linux and macOS (Apple Silicon, and Intel cross-compiled, both on the Mac mini; Windows is
# coming soon) from a `vX.Y.Z` tag into a DRAFT GitHub release plus SHA256SUMS(.sig). The builds
# are not public (lsuite's DISTRIBUTION.md):
# `scripts/publish-build.sh X.Y.Z` copies the draft to ludovic111/lsuite-builds, which
# lsuite.xyz serves to everyone (free, no account) and the app's updater reads.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release publication guards
        run: python3 scripts/tests/release_workflow.py
      - name: Verify immutable tag, version and release notes
        run: bash scripts/verify-release.sh

  build:
    needs: verify
    name: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Linux and macOS (owner's decision, 2026-10-10). The macOS rows run on the Mac mini
        # (vars.MAC_RUNNER=macos-latest sends them to GitHub): Apple Silicon natively, Intel
        # cross-compiled (`cross`: built and packaged only; its code is the Apple Silicon row's).
        # Windows is coming soon; its packaging steps below stay. To ship it again, add back
        #   { os: windows-latest, asset: ryolune-windows-x86_64.exe, archive: ryolune-windows-x86_64.zip }
        # and its files in the Checksums step, scripts/publish-release.sh and resume-release.yml.
        include:
          - os: macos-arm64
            asset: ryolune-macos-arm64.zip
            archive: ryolune-macos-arm64.zip
          - os: macos-x86_64
            target: x86_64-apple-darwin
            cross: true
            asset: ryolune-macos-x86_64.zip
            archive: ryolune-macos-x86_64.zip
          - os: ubuntu-22.04
            asset: ryolune-linux-x86_64
            archive: ryolune-linux-x86_64.zip
    runs-on: ${{ startsWith(matrix.os, 'macos') && (vars.MAC_RUNNER || 'ludovics-mac-mini') || matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Bound Linux compiler memory
        if: runner.os == 'Linux'
        run: |
          echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"
      - name: Linux native libraries
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev libssl-dev libzstd-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo fmt --all --check
        if: ${{ !matrix.cross }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: ${{ !matrix.cross }}
      - run: cargo test --workspace --locked
        if: ${{ !matrix.cross }}
        timeout-minutes: 15
      - run: cargo build --release --locked --workspace ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Complete song through MCP and CLI
        if: ${{ !matrix.cross }}
        run: python3 scripts/verify-song.py
      - name: Prepare Developer ID signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/prepare-apple-signing.sh
      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          RYOLUNE_TARGET: ${{ matrix.target }}
        run: bash scripts/package-macos.sh
      - name: Remove signing keychain and restore the keychain search list
        if: always() && runner.os == 'macOS'
        run: bash scripts/cleanup-apple-signing.sh
      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/ryolune dist/${{ matrix.asset }}
          tar -czf dist/ryolune-linux-x86_64.tar.gz -C target/release ryolune ryolune-cli ryolune-mcp
          python3 scripts/package-portable.py linux target/release dist/ryolune-linux-x86_64.zip
          python3 scripts/package-portable.py demo artifacts/song-verification dist/ryolune-Afterglow-demo.zip
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ryolune.exe dist/${{ matrix.asset }}
          python scripts/package-portable.py windows target/release dist/ryolune-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.archive }}
          if-no-files-found: error
      - name: Upload Linux tar and stock demo
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-and-stock-demo
          path: |
            dist/ryolune-linux-x86_64.tar.gz
            dist/ryolune-Afterglow-demo.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ryolune-macos-arm64.zip ryolune-macos-x86_64.zip ryolune-linux-x86_64.zip ryolune-linux-x86_64.tar.gz ryolune-linux-x86_64 ryolune-Afterglow-demo.zip > SHA256SUMS
      - name: Install signing binary runtime
        run: sudo apt-get update && sudo apt-get install -y libasound2 libudev1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-xcb1 libfontconfig1 libvulkan1 mesa-vulkan-drivers
      - name: Sign checksums
        env:
          RYOLUNE_SIGNING_KEY: ${{ secrets.ONDERA_SIGNING_KEY }}
        run: |
          if [ -z "$RYOLUNE_SIGNING_KEY" ]; then
            echo 'The RYOLUNE_SIGNING_KEY secret is not set. Installed apps refuse unsigned releases; add the secret from the key generated with `ryolune --release-keygen`.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RYOLUNE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          chmod +x dist/ryolune-linux-x86_64
          dist/ryolune-linux-x86_64 --sign-release "$RUNNER_TEMP/release.key" dist/SHA256SUMS
          dist/ryolune-linux-x86_64 --verify-release dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release.key"
      - name: Complete the draft release (scripts/publish-build.sh publishes it to lsuite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh
