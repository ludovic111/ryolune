name: Resume release publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag
        required: true
        type: string
      run_id:
        description: Release workflow run with every platform build successful
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify tag and source build provenance
        run: |
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" bash scripts/verify-release.sh
          gh run view "$SOURCE_RUN" --json workflowName,event,headSha,jobs > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-run.json').read_text())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          required = {'verify', 'ubuntu-22.04'}  # Linux only while lsuite is in beta
          passed = {job['name'] for job in run['jobs'] if job['conclusion'] == 'success'}
          if run['workflowName'] != 'Release' or run['event'] != 'push' or run['headSha'] != commit or not required <= passed:
              raise SystemExit('Source run must validate this exact tag on every released platform')
          print('Verified source build at', commit)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Install signing binary runtime
        run: sudo apt-get update && sudo apt-get install -y libasound2 libudev1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-xcb1 libfontconfig1 libvulkan1 mesa-vulkan-drivers
      - name: Sign and verify checksums
        env:
          RYOLUNE_SIGNING_KEY: ${{ secrets.ONDERA_SIGNING_KEY }}
        run: |
          test -n "$RYOLUNE_SIGNING_KEY"
          (cd dist && sha256sum ryolune-linux-x86_64.zip ryolune-linux-x86_64.tar.gz ryolune-linux-x86_64 ryolune-Afterglow-demo.zip > SHA256SUMS)
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.key"' EXIT
          printf '%s\n' "$RYOLUNE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          chmod +x dist/ryolune-linux-x86_64
          dist/ryolune-linux-x86_64 --sign-release "$RUNNER_TEMP/release.key" dist/SHA256SUMS
          dist/ryolune-linux-x86_64 --verify-release dist/SHA256SUMS
      - name: Publish complete draft or verify existing release
        run: GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" bash scripts/publish-release.sh
