name: Native Rust
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: Linux only, on ludodesktop (1-6 min). macOS and Windows run on main and by hand (gh workflow run).
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && '["macos-14", "macos-15-intel", "ubuntu-22.04", "windows-latest"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ (matrix.os == 'ubuntu-22.04' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && (vars.LINUX_RUNNER || 'ludodesktop') || matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # On ludodesktop, keep target/ between runs (incremental builds).
          clean: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Bound Linux compiler memory
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_TEST_DEBUG=0' >> "$GITHUB_ENV"
      - name: Linux native libraries
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev libssl-dev libzstd-dev
      - name: Own Rust install per repo on ludodesktop
        # The runners of several repos run at once; a shared ~/.rustup makes their installs collide.
        if: runner.environment == 'self-hosted'
        run: |
          echo "RUSTUP_HOME=$HOME/.rustup-${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$HOME/.cargo-${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 15
      - run: cargo build --release --locked --workspace
      - name: Complete song through MCP and CLI
        run: python3 scripts/verify-song.py
      - name: Song verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: Song-verification-${{ matrix.os }}
          path: artifacts/song-verification/verification.json
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ryolune-${{ matrix.os }}
          path: dist/ryolune-macos-*.zip
      - name: Upload Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ryolune-linux-x86_64
          path: |
            target/release/ryolune
            target/release/ryolune-cli
            target/release/ryolune-mcp
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ryolune-windows-x86_64
          path: |
            target/release/ryolune.exe
            target/release/ryolune-cli.exe
            target/release/ryolune-mcp.exe
      - name: Upload macOS command-line tools
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ryolune-tools-${{ matrix.os }}
          path: |
            target/release/ryolune-cli
            target/release/ryolune-mcp
