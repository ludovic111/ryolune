[package]
name = "ryolune-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ryolune command-line client and MCP server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ryolune-cli"
path = "src/bin/ryolune-cli.rs"

[[bin]]
name = "ryolune-mcp"
path = "src/bin/ryolune-mcp.rs"

[dependencies]
ryolune-engine = { path = "../engine" }
serde_json.workspace = true
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
