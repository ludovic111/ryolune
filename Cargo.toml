[workspace]
members = ["sdk", "engine", "desktop", "tools", "plugins/gain", "plugins/bitcrusher", "plugins/chorus", "plugins/abi1-fixture"]
default-members = ["desktop"]
resolver = "2"

[workspace.package]
version = "0.15.3"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
